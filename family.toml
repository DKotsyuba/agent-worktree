schema_version = 1
product = "agent-worktree"
repository = "DKotsyuba/agent-worktree"
env_prefix = "AGENT_WORKTREE_"
standard_version = "1.0.0-rc.2"
response_profile = "rust-minijinja-v1"
devkit_version = "0.2.0"
baseline = "rust-macos-2026-09-candidate1"
qualification = "not_verified"

[profiles]
process = "in-process"
state = "local"
transports = ["stdio"]
host_adapter = false

[compatibility]
candidate_targets = ["aarch64-apple-darwin"]
qualified_targets = []
qualified_hosts = []

[release]
enabled = false
workflow = "release.yml"
delivery_profile = "single-binary-v1"
trust_profile = "github-authenticated"
