[workspace]
members = ["crates/mcp-presentation", "crates/family-delivery", "xtask"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
minijinja = { version = "=2.24.0", default-features = false, features = ["serde", "fuel"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time", "process"] }
sha2 = "0.10"
fs2 = "0.4"
toml = "0.8"
semver = "1"
tempfile = "3"

[package]
name = "agent-worktree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap.workspace = true
mcp-presentation = { path = "crates/mcp-presentation" }
family-delivery = { path = "crates/family-delivery" }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
minijinja.workspace = true
tokio.workspace = true
sha2.workspace = true
fs2.workspace = true
toml.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile.workspace = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
